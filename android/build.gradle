plugins {
    id 'com.android.application' version '8.13.2'
}

def versionMatch = file('../Cargo.toml').text =~ /(?m)^version\s*=\s*"([0-9]+)\.([0-9]+)\.([0-9]+)"/
if (!versionMatch.find()) throw new GradleException('Could not read OPON version from Cargo.toml')
def parts = (1..3).collect { versionMatch.group(it).toInteger() }
def rustLibrary = providers.gradleProperty('oponRustLibrary').map { file(it) }
    .orElse(file('../target/aarch64-linux-android/release/libopon_app.so'))
def nativeDir = layout.buildDirectory.dir('opon-native')
def stageRust = tasks.register('stageRust', Sync) {
    from(rustLibrary)
    into(nativeDir.map { it.dir('arm64-v8a') })
    doFirst {
        if (!rustLibrary.get().isFile()) throw new GradleException('Build the OPON Rust library for Android first')
    }
}

android {
    namespace = 'io.github.yashu7.opon'
    compileSdk = 36
    buildToolsVersion = '36.0.0'
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = 'io.github.yashu7.opon'
        minSdk = 26
        targetSdk = 36
        versionName = parts.join('.')
        // Preserve the version-code convention of the previous cargo-apk releases.
        versionCode = (1 << 24) + (parts[0] << 16) + (parts[1] << 8) + parts[2]
        ndk { abiFilters.add('arm64-v8a') }
    }

    sourceSets {
        main {
            res.srcDirs += '../assets/android'
            jniLibs.srcDir(nativeDir)
        }
    }
}

tasks.named('preBuild').configure { dependsOn(stageRust) }

dependencies {
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
}
